[project]
name = "edupredict-trujillo"
version = "1.0.0"
description = "Sistema predictivo de desercion universitaria (FastAPI + HTML5 para Vercel)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pandas>=2.0,<3.0",
    "numpy>=1.24",
]

[tool.vercel]
entrypoint = "api.index:app"